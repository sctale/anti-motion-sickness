name: Android Release APK

# 触发方式（二选一，均不会在普通 push 时运行，避免消耗 Actions 配额）：
#   1) 手动：Actions → Android Release APK → Run workflow（版本号取自 app.json）
#   2) 打标签：git push origin v0.3.0（版本号取自标签）
# 若对应 Release 已附带 APK（例如本地 release.ps1 已发布），自动跳过构建，
# 避免本地/CI 两套 debug 签名互相覆盖。
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建成功后创建/更新 GitHub Release (vX.Y.Z)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号并检查是否已发布
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./app.json').expo.version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="v$VERSION"
          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null \
             | grep -q "anti-motion-sickness-$TAG.apk"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG 已包含 APK，跳过构建（避免签名覆盖）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript 检查
        run: npx tsc --noEmit

      - name: Prebuild（生成 android/ 并注入原生层）
        run: npx expo prebuild --platform android --no-install

      - name: 校验原生层注入结果
        run: |
          set -e
          KT_DIR=android/app/src/main/java/com/anonymous/anticarsicknessrn
          test -f "$KT_DIR/OverlayService.kt"
          test -f "$KT_DIR/MotionCueEngine.kt"
          test -f "$KT_DIR/RotationMath.kt"
          grep -q "add(OverlayPackage())" "$KT_DIR/MainApplication.kt"
          grep -q "OverlayService" android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/drawable/ic_stat_motion.xml
          echo "原生层注入校验通过"

      - name: 构建 Release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 校验 APK 版本号并改名
        run: |
          set -e
          VERSION="${{ needs.guard.outputs.version }}"
          APK=android/app/build/outputs/apk/release/app-release.apk

          if [ -z "$ANDROID_HOME" ]; then export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"; fi
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | tail -1)

          ls -lh "$APK"
          "$AAPT" dump badging "$APK" | grep "^package:" | tee /tmp/badging.txt
          grep -q "versionName='$VERSION'" /tmp/badging.txt || {
            echo "::error::APK versionName 与期望版本 $VERSION 不一致"; exit 1;
          }
          cp "$APK" "anti-motion-sickness-v$VERSION.apk"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: anti-motion-sickness-v${{ needs.guard.outputs.version }}-apk
          path: anti-motion-sickness-v*.apk
          retention-days: 30

      - name: 从 CHANGELOG 生成发布说明
        run: |
          set -e
          VERSION="${{ needs.guard.outputs.version }}"
          {
            echo "# v$VERSION"
            echo
            echo "> 防晕车助手 Android Release APK（debug 签名，仅用于真机测试安装）"
            echo
          } > /tmp/notes.md
          awk -v v="$VERSION" '$0 ~ "^## \\["v"\\]" {flag=1; next} /^## \[/ {flag=0} flag' CHANGELOG.md >> /tmp/notes.md
          echo "----- 发布说明 -----"; cat /tmp/notes.md

      - name: 创建/更新 GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v${{ needs.guard.outputs.version }}"
          FILE="anti-motion-sickness-$TAG.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖 APK"
            gh release upload "$TAG" "$FILE#anti-motion-sickness-$TAG.apk" --clobber
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" "$FILE#anti-motion-sickness-$TAG.apk" \
              --title "$TAG" \
              --notes-file /tmp/notes.md
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"